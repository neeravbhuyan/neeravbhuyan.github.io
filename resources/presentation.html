<script>
function copyCode(btn) {
  const pre = btn.closest('.code-wrap').querySelector('pre');
  navigator.clipboard.writeText(pre.innerText).then(() => {
    const originalText = btn.textContent;
    btn.textContent = 'Copied!';
    btn.style.background = 'var(--teal)';
    btn.style.color = '#000';
    btn.style.borderColor = 'var(--teal)';
    setTimeout(() => {
      btn.textContent = originalText;
      btn.style.background = '';
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  }).catch(err => console.error(err));
}

const slides = [

// ─── 0: TITLE ───
{html: `
<div class="slide-body" style="display:flex;flex-direction:column;justify-content:center;">
  <h3>Indian Statistical Institute · Project Presentation</h3>

// ─── 1: THE CORE PROBLEM ───
{html: `
<div class="slide-body">
  <h3>Problem Formulation</h3>
  <h2>The Problem: Too Many Pixels!</h2>
  <p>Recognizing human faces directly from raw pixels is incredibly slow and difficult for a computer.</p>
  
  <div class="two-col">
    <div>
      <div class="highlight-box">
        <p><strong>Huge Data Size:</strong> A standard face image of 112 by 92 pixels creates a massive list of numbers:</p>
        <p style="text-align:center;color:var(--teal);margin-top:16px;font-size:26px;">$$D = 112 \\times 92 = 10{,}304 \\text{ pixels}$$</p>
      </div>
      <p style="margin-top:16px;">Comparing images using 10,304 numbers takes up too much memory. It also confuses the computer because minor details (like shadows) overpower the important facial features.</p>
    </div>
    <div>
      <div class="finding-card">
        <div class="finding-icon">💡</div>
        <div class="finding-text"><strong>Lighting vs. Identity:</strong> Raw pixels are easily fooled. A photo of you in a dark room might look mathematically closer to a stranger in a dark room than to a photo of you in the sun.</div>
      </div>
      <div class="finding-card">
        <div class="finding-icon">📉</div>
        <div class="finding-text"><strong>The Solution (Eigenfaces):</strong> Faces have a much simpler hidden structure. By finding the core visual patterns that vary the most across all faces (called <strong>Eigenfaces</strong>), we can shrink the data from thousands of pixels down to just a few dozen numbers.</div>
      </div>
    </div>
  </div>
</div>
`, badge:'badge-intro', section:'Motivation', title:'Curse of Dimensionality'},

// ─── 2: PRELIMINARY EXPERIMENT (TOY 50-IMAGE MODEL) ───
{html: `
<div class="slide-body">
  <h3>Phase 1 · Baseline Prototype</h3>
  <h2>The 50-Image Toy Model & The "100% Accuracy" Trap</h2>
  <p>We started by building a basic prototype using a tiny, perfect dataset: <strong>50 grayscale face images</strong> across 10 distinct people.</p>
  
  <div class="two-col">
    <div>
      <table class="var-table">
        <thead><tr><th>Setup</th><th>Prototype Value</th><th>Result/Observation</th></tr></thead>
        <tbody>
          <tr><td>Dataset Scope</td><td>50 images (40 train / 10 test)</td><td>10 people total</td></tr>
          <tr><td>Image Resolution</td><td>112 x 92 (Grayscale)</td><td>Vector length = 10,304</td></tr>
          <tr><td>Math Used</td><td>Thin SVD</td><td>Extracts features directly</td></tr>
          <tr><td>Features Kept</td><td>7 Eigenfaces</td><td>Kept 90% of the visual info</td></tr>
          <tr><td>Classifier</td><td>Linear SVM</td><td><strong>100.00% Accuracy</strong></td></tr>
        </tbody>
      </table>
    </div>
    <div>
      <div class="alert-box">
        <p><strong>Why 100% Accuracy was Misleading:</strong><br><br>
        1. <strong>Perfect Lab Photos:</strong> Clean backgrounds, perfectly centered faces, and identical lighting.<br>
        2. <strong>Few People to Guess From:</strong> Only 10 identities to separate.<br>
        3. <strong>Data Memorization:</strong> When you only have 10 people and perfect lighting, simple math easily separates the 7 features. It gave us a false sense of success before hitting the real world.</p>
      </div>
    </div>
  </div>
</div>
`, badge:'badge-phase1', section:'Phase 1: Prototype', title:'The Toy Model'},

// ─── 3: CODE FOR PROTOTYPE ───
{html: `
<div class="slide-body">
  <h3>Phase 1 · Implementation</h3>
  <h2>How the 50-Image Model Worked</h2>
  <p>This early code loaded 50 images, found the "average face", extracted the 7 most important visual patterns, and predicted the test faces perfectly.</p>

  <div class="code-wrap">
    <div class="code-header">
      <span class="code-lang">Python · Prototype Code (grayfaces)</span>
      <button class="copy-btn" onclick="copyCode(this)">Copy</button>
    </div>
    <pre><span class="cm"># 1. Find the average face and center the data</span>
global_mean_face = np.mean(X_train, axis=0)
X_train_centered = X_train - global_mean_face

<span class="cm"># 2. Extract the features directly (Thin SVD)</span>
A = X_train_centered.T
U, S, Vt = svd(A, full_matrices=False)

<span class="cm"># 3. Keep only the most important features (90% of the information)</span>
explained_variance_ratio = (S ** 2) / np.sum(S ** 2)
cumulative_variance = np.cumsum(explained_variance_ratio)
M_prime = np.searchsorted(cumulative_variance, 0.90) + 1  <span class="cm"># Output: 7 Eigenfaces</span>
eigenfaces = U[:, :M_prime]

<span class="cm"># 4. Convert images to small number lists & Classify</span>
omega_train = X_train_centered @ eigenfaces
omega_test = (X_test - global_mean_face) @ eigenfaces
clf = SVC(kernel='linear')
clf.fit(omega_train, y_train)
<span class="cm"># Result: 10/10 test predictions correct (100%)</span></pre>
  </div>
</div>
`, badge:'badge-phase1', section:'Phase 1: Prototype', title:'Prototype Code'},

// ─── 4: SCALING TO THE FULL DATASET & EARLY FAILURES ───
{html: `
<div class="slide-body">
  <h3>Phase 2 · Scaling Up</h3>
  <h2>Real-World Reality Check: Scaling to 6,000 Images</h2>
  <p>When we moved from 50 perfect images to our massive, messy dataset (<strong>6,053 images of 1,434 different people</strong>), the model completely collapsed, getting only <strong>10.40% right</strong>.</p>
  
  <div class="two-col">
    <div>
      <div class="alert-box">
        <p><strong>Failure 1: The Single-Photo Problem</strong><br>
        Hundreds of people in the dataset only had 1 or 2 photos. If someone's only photo ended up in the testing set, the model had <em>never seen them before</em> during training. It was mathematically impossible to guess correctly.</p>
      </div>
      <div class="alert-box" style="margin-top:14px;">
        <p><strong>Failure 2: The Infrared Color Problem</strong><br>
        We tried turning the images into cool-looking thermal/infrared heatmaps to boost contrast. But when converting them back to readable data, it destroyed subtle shadows around the nose and eyes, ruining the facial structure.</p>
      </div>
    </div>
    <div>
      <div class="alert-box">
        <p><strong>Failure 3: Unequal Feature Weights</strong><br>
        The first 2 or 3 extracted features contained huge, overpowering numbers, while the remaining 89 features had tiny numbers. The model ignored the tiny details completely, acting as if they didn't exist.</p>
      </div>
      <div class="highlight-box" style="margin-top:14px;">
        <p><strong>Diagnosis:</strong> The model didn't need more features; it needed better data cleaning, balanced numbers, and a smarter way to handle single photos.</p>
      </div>
    </div>
  </div>
</div>
`, badge:'badge-phase2', section:'Phase 2: Diagnosis', title:'Initial Scaling Failures'},

// ─── 5: DATA PIPELINE ARCHITECTURE ───
{html: `
<div class="slide-body">
  <h3>Phase 2 · Refinement</h3>
  <h2>Fixing the Data Pipeline</h2>
  <p>To solve these bottlenecks, we rebuilt the data process to load images directly from the web, strictly filter out people with too few photos, and read images in pure grayscale.</p>

  <div class="code-wrap">
    <div class="code-header">
      <span class="code-lang">Python · Memory Loading & Filtering Pipeline</span>
      <button class="copy-btn" onclick="copyCode(this)">Copy</button>
    </div>
    <pre><span class="cm"># 1. Pure Grayscale Decoding (No Infrared Damage)</span>
img_color = cv2.imdecode(img_array, cv2.IMREAD_COLOR)
img_resized = cv2.resize(img_color, (92, 112))
img_gray = cv2.cvtColor(img_resized, cv2.COLOR_BGR2GRAY)
image_vectors.append(img_gray.flatten())  <span class="cm"># Vector length: 10,304</span>

<span class="cm"># 2. Filter out people with fewer than 5 photos</span>
MIN_SAMPLES = 5
unique_labels, counts = np.unique(y_raw, return_counts=True)
valid_labels = unique_labels[counts >= MIN_SAMPLES]
valid_mask = np.isin(y_raw, valid_labels)

X, y = X_raw[valid_mask], y_raw[valid_mask]
<span class="cm"># Filtered: 3,332 images across 355 people (down from 6,053 images)</span>

<span class="cm"># 3. Train-Test Split (Guarantees every test person is in the training set)</span>
X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.20, random_state=42, stratify=y
) <span class="cm"># Training: 2,665 samples | Testing: 667 samples</span></pre>
  </div>
</div>
`, badge:'badge-phase2', section:'Phase 2: Engineering', title:'Pipeline Architecture'},

// ─── 6: MATHEMATICAL FORMULATION: SVD VS COVARIANCE ───
{html: `
<div class="slide-body">
  <h3>Mathematical Foundation</h3>
  <h2>The Shortcut: Direct SVD vs. The Old Way</h2>
  <p>To find the Eigenfaces, we need to extract the core patterns from a massive grid of data. How do we do this without crashing the computer?</p>
  
  <div class="two-col">
    <div>
      <div class="rq-box">
        <div class="rq-text">The Old Way (Covariance Matrix):</div>
        <p style="margin-top:12px;font-size:17px;">The traditional method creates a massive grid comparing every single pixel to every other pixel ($10{,}304 \\times 10{,}304$). This creates a matrix with over 100 million entries!</p>
        <p style="margin-top:12px;font-size:17px;">Calculating this requires trillions of operations, which easily crashes normal computers. Even traditional shortcuts create massive rounding errors that wipe out the smaller, finer facial details.</p>
      </div>
    </div>
    <div>
      <div class="highlight-box">
        <p><strong>The Solution (Thin SVD):</strong><br>
        Instead of building a massive comparison grid, we use a direct mathematical shortcut called Thin SVD to break the data down directly:</p>
        <p style="text-align:center;color:var(--teal);margin-top:16px;font-size:26px;">$$A = U \\Sigma V^T$$</p>
        <p style="margin-top:14px;font-size:17px;">• $U$ gives us the <strong>Eigenfaces</strong>.<br>
        • $\\Sigma$ tells us how important each face pattern is.<br>
        • This breaks the data down in a single pass without building huge intermediate matrices, saving time and preventing rounding errors.</p>
      </div>
    </div>
  </div>
</div>
`, badge:'badge-math', section:'Mathematics', title:'Thin SVD Theory'},

// ─── 7: SUBSPACE TRUNCATION & VARIANCE ───
{html: `
<div class="slide-body">
  <h3>Mathematical Foundation</h3>
  <h2>Shrinking the Data & Balancing the Features</h2>
  <p>Instead of keeping all the information (including background noise), we only keep the top features that capture 90% of what makes the faces different.</p>
  
  <div class="two-col">
    <div>
      <div class="highlight-box">
        <p><strong>Keeping the Best Features:</strong> We pick the top 93 most important Eigenfaces that make up 90% of the dataset's total variance.</p>
        <p style="text-align:center;color:var(--gold);margin-top:16px;font-size:24px;">$$M' = 93$$</p>
      </div>
      <p style="margin-top:14px;">This shrinks the face images from <strong>10,304 pixels down to just a tiny list of 93 numbers</strong>—a 99% reduction in size!</p>
    </div>
    <div>
      <div class="finding-card">
        <div class="finding-icon">📐</div>
        <div class="finding-text"><strong>Projecting the Faces:</strong> Every face is compared against these 93 core patterns to get a final, short list of 93 "weights" describing the face.</div>
      </div>
      <div class="finding-card">
        <div class="finding-icon">⚖️</div>
        <div class="finding-text"><strong>Balancing the Features:</strong> To fix the "Unequal Weights" problem, we balance the features using Z-score standardization so that no single feature overpowers the rest. Now, the 93rd detail is just as loud as the 1st.</div>
      </div>
    </div>
  </div>
</div>
`, badge:'badge-math', section:'Mathematics', title:'Data Shrinking'},

// ─── 8: THE MULTI-CLASS SVM CLASSIFIER ───
{html: `
<div class="slide-body">
  <h3>Classification Strategy</h3>
  <h2>Identifying the Faces with Polynomial SVM</h2>
  <p>Once we've shrunk the faces down to 93 balanced numbers, we use an algorithm called a Support Vector Machine (SVM) to learn which numbers belong to which person.</p>
  
  <div class="two-col">
    <div>
      <div class="code-wrap">
        <div class="code-header">
          <span class="code-lang">Python · Training the AI</span>
          <button class="copy-btn" onclick="copyCode(this)">Copy</button>
        </div>
        <pre><span class="cm"># Balance the 93 extracted features</span>
scaler = StandardScaler()
omega_train = scaler.fit_transform(W_train)
omega_test  = scaler.transform(W_test)

<span class="cm"># Train the Polynomial SVM to recognize faces</span>
svm_classifier = SVC(
    kernel="poly", 
    degree=2, 
    coef0=1.0, 
    random_state=42
)
svm_classifier.fit(omega_train, y_train)

<span class="cm"># Predict the identities of the 667 test faces</span>
y_pred = svm_classifier.predict(omega_test)</pre>
      </div>
    </div>
    <div>
      <div class="finding-card">
        <div class="finding-icon">🧠</div>
        <div class="finding-text"><strong>Why use a "Polynomial Kernel"?</strong> If someone tilts their head or smiles, their numbers change in curved patterns. A simple straight line can't separate the people properly. The Polynomial tool (degree 2) allows the algorithm to understand the complex, curved differences between faces without memorizing the noise.</div>
      </div>
    </div>
  </div>
</div>
`, badge:'badge-math', section:'Classification', title:'SVM Setup'},

// ─── 11: DRAWBACKS & THE EIGENFACE CEILING ───
{html: `
<div class="slide-body">
  <h3>Critical Analysis</h3>
  <h2>Why didn't we get 90%? The Flaws of the Math</h2>
  <p>Why does this method get stuck around 28%? The underlying math has a few fundamental flaws when dealing with real-world photos.</p>
  
  <div class="two-col">
    <div>
      <div class="alert-box">
        <p><strong>1. Faces Must Be Perfectly Lined Up:</strong><br>
        This math assumes pixels match perfectly. If a person tilts their head slightly, their eyes shift a few pixels over. The algorithm doesn't realize it's still an eye—it just sees changes in numbers and gets confused.</p>
      </div>
      <div class="alert-box" style="margin-top:14px;">
        <p><strong>2. Lighting Overpowers the Face:</strong><br>
        The algorithm looks for the biggest changes in the data. Because shadows from a bright window cause bigger pixel changes than a different nose shape, the algorithm accidentally focuses on the room lighting instead of the person's identity.</p>
      </div>
    </div>
    <div>
      <div class="alert-box">
        <p><strong>3. Straight Lines vs. Curved Reality:</strong><br>
        As humans rotate their heads, the pixel changes create complex, curved patterns. This simple math tries to draw straight lines to separate people, which inevitably causes different people's faces to overlap in the data.</p>
      </div>
      <div class="highlight-box" style="margin-top:14px;">
        <p><strong>4. Blind to Labels:</strong><br>
        When shrinking the data, the algorithm doesn't actually know <em>who</em> is in the picture. It just shrinks everything blindly, instead of actively finding what makes each person unique.</p>
      </div>
    </div>
  </div>
</div>
`, badge:'badge-res', section:'Results (3/3)', title:'Theoretical Drawbacks'},

// ══════════════════════════════════════════════════════════════════
//  DECK CONTROLLER ENGINE
// ══════════════════════════════════════════════════════════════════
let current = 0;
const total = slides.length;
const deck = document.getElementById('deck');
const curEl = document.getElementById('cur');
const totEl = document.getElementById('tot');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progress = document.getElementById('progress-bar');

totEl.textContent = total;

slides.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i === 0 ? ' active' : '');
  el.id = `slide-${i}`;
  el.innerHTML = `
    <div class="slide-header">
      <div class="section-badge ${s.badge}">${s.section}</div>
      <div class="slide-header-title">${s.title}</div>
    </div>
    ${s.html}
  `;
  deck.appendChild(el);
});

function updateNav() {
  curEl.textContent = current + 1;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
  progress.style.width = ((current + 1) / total * 100) + '%';
}

function goTo(idx) {
  if (idx < 0 || idx >= total || idx === current) return;
  document.getElementById(`slide-${current}`).className = 'slide out';
  document.getElementById(`slide-${idx}`).className = 'slide active';
  current = idx;
  updateNav();
  if (slides[current].onRender) {
    setTimeout(() => slides[current].onRender(), 60);
  }
}

function nextSlide() { goTo(current + 1); }
function prevSlide() { goTo(current - 1); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
});

updateNav();
if (slides[0].onRender) slides[0].onRender();
</script>
